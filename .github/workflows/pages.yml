name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js for verification
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate and build offline application
        run: |
          node --check app.js
          node --check converter.js
          python scripts/build.py
          node tests/converter.test.cjs
          python scripts/verify_public.py
      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html style.css app.js converter.js template.js .nojekyll _site/
          cp -r downloads _site/downloads
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
